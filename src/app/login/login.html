<div class="login-container">
  <div class="login-card">
    <h2>Pedidos360</h2>

    <nav class="tabs">
      <button [class.active]="modo() === 'login'" (click)="cambiarModo('login')">Iniciar sesión</button>
      <button [class.active]="modo() === 'registro'" (click)="cambiarModo('registro')">Registrarme</button>
    </nav>

    @switch (modo()) {
      @case ('login') {
        <form (ngSubmit)="iniciarSesion()">
          <div>
            <label for="email">Correo</label>
            <input type="email" id="email" [(ngModel)]="email" name="email" required />
          </div>
          <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" required />
          </div>
          <button type="submit" class="btn-primary">Ingresar</button>
        </form>
        <a class="link-secundario" (click)="cambiarModo('recuperar')">¿Olvidaste tu contraseña?</a>
      }

      @case ('registro') {
        <form (ngSubmit)="registrarUsuario()">
          <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" [(ngModel)]="nombreRegistro" name="nombre" required />
          </div>
          <div>
            <label for="regEmail">Correo</label>
            <input type="email" id="regEmail" [(ngModel)]="emailRegistro" name="regEmail" required />
          </div>
          <div>
            <label for="regPassword">Contraseña</label>
            <input type="password" id="regPassword" [(ngModel)]="passwordRegistro" name="regPassword" required />
          </div>
          <button type="submit" class="btn-primary">Crear cuenta</button>
        </form>
      }

      @case ('recuperar') {
        <form (ngSubmit)="enviarRecuperacion()">
          <p>Ingresa tu correo y te enviaremos instrucciones para recuperar tu contraseña.</p>
          <div>
            <label for="recEmail">Correo</label>
            <input type="email" id="recEmail" [(ngModel)]="emailRecuperar" name="recEmail" required />
          </div>
          <button type="submit" class="btn-primary">Enviar</button>
        </form>
        <a class="link-secundario" (click)="cambiarModo('login')">Volver a iniciar sesión</a>
      }
    }

    <a routerLink="/" class="link-volver">← Volver al inicio</a>
  </div>
</div>
